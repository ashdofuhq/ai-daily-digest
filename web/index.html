<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Daily Digest — 每日 AI 热点</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Background gradient mesh -->
  <div class="bg-mesh"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">◆</span>
        <h1>AI Daily Digest</h1>
        <span class="logo-sub">每日 AI 热点</span>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="切换暗色/亮色模式">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a class="gh-link" href="https://github.com" target="_blank" rel="noopener" title="View on GitHub">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <!-- Stats bar -->
  <section class="stats-bar">
    <div class="stats-inner">
      <div class="stat-date" id="statDate">加载中...</div>
      <div class="stat-count" id="statCount">—</div>
    </div>
  </section>

  <!-- Search & Filters -->
  <section class="filters">
    <div class="filters-inner">
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="搜索论文、项目、关键词..." autocomplete="off">
        <button class="search-clear hidden" id="searchClear" aria-label="Clear search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="filter-group" id="sourceFilters">
        <!-- Populated by JS -->
      </div>
    </div>
    <div class="filter-group tag-group" id="tagFilters">
      <!-- Populated by JS -->
    </div>
  </section>

  <!-- Card grid -->
  <main class="card-grid" id="cardGrid">
    <!-- Populated by JS -->
  </main>

  <!-- Empty state -->
  <div class="empty-state hidden" id="emptyState">
    <div class="empty-icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </div>
    <h3>没有找到匹配的结果</h3>
    <p>试试调整搜索词或筛选条件</p>
  </div>

  <!-- Load more -->
  <div class="load-more" id="loadMore">
    <button class="btn-load" id="loadMoreBtn">加载更多</button>
  </div>

  <!-- Loading state -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>正在收集 AI 热点...</p>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-sources">
        <span>数据来源:</span>
        <span class="source-dot arxiv"></span> Arxiv
        <span class="source-dot github"></span> GitHub
        <span class="source-dot huggingface"></span> HuggingFace
        <span class="source-dot paperswithcode"></span> Papers With Code
        <span class="source-dot hackernews"></span> Hacker News
      </div>
      <div class="footer-copy">每日自动更新 · AI Daily Digest</div>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
